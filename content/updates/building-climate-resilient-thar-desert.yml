slug: building-climate-resilient-thar-desert
title: Building Climate-Resilient Agriculture in the Thar Desert
date: 18 July, 2026
venue: Rajasthan
summary: >-
  Unnati is promoting Horti-Pasture Plot development as a sustainable and climate-resilient agricultural approach in the
  Thar Desert, supporting communities with technical knowledge, practical demonstrations and essential agricultural
  inputs.
details:
  - >-
    The Thar Desert presents unique agricultural challenges due to extreme climatic conditions, limited rainfall, water
    scarcity, and fragile soil ecosystems. To support communities in overcoming these challenges, Unnati is promoting
    Horti-Pasture Plot development as a sustainable and climate-resilient agricultural approach.
  - >-
    Through this initiative, communities are supported with technical knowledge, practical demonstrations, and essential
    agricultural inputs to improve productivity and strengthen their understanding of improved farming practices.
  - >-
    Unnati supports farmers with coated seeds for better germination and healthy crop growth, pathar patti and wire
    fencing for plot protection, composting techniques to improve soil fertility, and guidance on insect management
    practices to reduce crop losses and promote healthier production.
  - >-
    The initiative focuses on helping communities maximize the potential of their land, increase crop productivity, and
    improve income opportunities by adopting suitable agricultural practices and making efficient use of available
    resources.
  - >-
    By connecting technical knowledge with field-level practice, Unnati is enabling farmers to build confidence, enhance
    productivity, and develop resilient farming systems suited to the challenging environment of the Thar Desert. These
    efforts aim to help farmers increase their agricultural output, strengthen livelihoods, and create sustainable
    sources of income.
