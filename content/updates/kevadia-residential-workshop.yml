slug: kevadia-residential-workshop
title: 2 Day Residential Workshop at Kevadia, Narmada
date: 18–19 December, 2025
venue: Ekta Nagar (Kevadia), Gujarat
summary: >-
  UNNATI, with the Kaivalya Education Foundation and Capacity Building Commission, conducted a two-day residential
  workshop under the Viksit Panchayat initiative for around 40 Sarpanches and Talatis from Narmada and Kutch.
details:
  - >-
    UNNATI, in partnership with the Kaivalya Education Foundation (KEF) and Capacity Building Commission (CBC),
    Government of India, successfully conducted a two-day residential capacity building workshop under the Viksit
    Panchayat initiative on December 18-19, 2025 at Ekta Nagar (Kevadia), Gujarat. The workshop brought together around
    40 Sarpanches and Talatis from 15 selected Gram Panchayats of Dediapada block (Narmada district) and Rapar block
    (Kutch district), including 8 women members. Designed as the first phase of a year-long pilot, the programme aimed
    to strengthen participatory, inclusive, and citizen-centric governance at the Gram Panchayat level through sustained
    engagement, peer learning, and reflection across diverse local contexts.
  - >-
    Over the two days, participants engaged in interactive sessions on effective conduct of Gram Sabhas, participatory
    Gram Panchayat Development Planning (GPDP), localisation of Sustainable Development Goals (LSDGs), the Panchayat
    Advancement Index (PAI), and the use of digital governance platforms. Through role plays, group discussions, visual
    media, and experience sharing, the workshop encouraged Panchayat representatives and functionaries to move beyond
    infrastructure-focused development and reflect on transparency, accountability, and citizen participation as core
    governance principles. The residential format enabled open dialogue and strengthened coordination between elected
    representatives and Panchayat secretaries. The learnings and insights from this workshop will inform subsequent
    field-level handholding and thematic support under the Viksit Panchayat initiative.
