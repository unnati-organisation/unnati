slug: training-pashu-sakhi
title: Training of Pashu Sakhi (Community Educator on Animal Husbandry)
date: 09–10 June, 2026
venue: Sindhari, Rajasthan
summary: >-
  A two-day training was conducted for 40 Pashu Sakhis in Sindhari Block, Balotra, Rajasthan, focused on goat health and
  management practices to improve livelihoods in Barmer district.
details:
  - >-
    Under initiative to strengthen food and nutrition security in Balotra block of Barmer district, Rajasthan, an effort
    has been being made to develop Pashu Sakhi (Community Educator on Animal Husbandry). These are women leaders who are
    supporting farmers with livestock on for animal health, hygiene, vaccination and nutritious food for their animals
    etc. through information and other support. As part of their capacity building initiative, a two-days training was
    conducted in Sindhari Block, Balotra, Rajasthan, with the participation 40 Pashu Sakhis.
  - >-
    The training focused on goat health and management practices, including nutrition, deworming, vaccination, and
    colostrum feeding. Participants actively discussed common diseases such as PPR, Khur Pakka-Muh Pakka, diarrhea, and
    bloat, while learning preventive measures and locally available treatment methods.
  - >-
    Special emphasis was placed on reducing goat mortality, improving productivity, and promoting sustainable
    goat-rearing practices. The session also highlighted collective marketing strategies, better income opportunities
    through planned goat sales during Bakra Eid, and awareness of government livestock schemes.
  - >-
    The training proved highly interactive and strengthened the knowledge and practical skills of participants for
    improved and sustainable livelihoods.
