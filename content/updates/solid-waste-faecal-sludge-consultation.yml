slug: solid-waste-faecal-sludge-consultation
title: One-Day State Consultation on Management of Solid Waste, Faecal Sludge, and Septage
date: 29 December, 2025
venue: Jaipur
summary: >-
  UNNATI, with the Department of Local Self Governance, Government of Rajasthan and UNICEF's Rajasthan CMC Partners,
  organised a state-level consultation bringing together 165 participants on urban sanitation systems.
details:
  - >-
    UNNATI, in collaboration with the Department of Local Self Governance, Government of Rajasthan, and Rajasthan CMC
    Partners of UNICEF, organised a one-day state-level consultation on “Management of Solid Waste, Faecal Sludge, and
    Septage” on 29 December 2025 at Hotel Cygnet Park BL, Jaipur. The consultation brought together 165 participants,
    including representatives from Urban Local Bodies (ULBs), state government departments, civil society organisations,
    and sanitation sector practitioners.
  - >-
    The consultation was organised in the context of Rajasthan's ongoing efforts to strengthen urban sanitation and
    solid waste management systems, with a focus on inclusivity, sustainability, and accountability. Drawing from
    UNNATI's three-year engagement in 12 Urban Local Bodies of Jodhpur Division under the Urban WASH programme, the
    consultation provided a platform for cross-learning on system strengthening and rights-based approaches to
    sanitation service delivery.
  - >-
    The programme was structured around three thematic panel discussions focusing on (i) inclusion of waste pickers and
    sanitation workers in solid waste management systems, (ii) strengthening sanitation services through community
    participation, and (iii) capacity building of Urban Local Bodies. Experiences and best practices were shared from
    Pune, Davanagere, Odisha, Udaipur, Dungarpur, and Abu Road, highlighting models related to worker integration,
    decentralised faecal sludge and septage management, community-led sanitation initiatives, and institutional
    strengthening.
  - >-
    The discussions underscored the importance of formal recognition of sanitation workers, community participation,
    decentralised infrastructure, and capacity enhancement of ULBs to achieve inclusive and sustainable sanitation
    outcomes. The consultation concluded with reflections from senior government officials and reaffirmed the need for
    continued collaboration between government institutions and civil society organisations to strengthen urban
    sanitation systems in Rajasthan.
