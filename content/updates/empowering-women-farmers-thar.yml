slug: empowering-women-farmers-thar
title: Empowering Women Farmers Through Sustainable Agriculture in Western Rajasthan (Thar Desert)
date: 07–08 July, 2026
venue: Rajasthan
summary: >-
  The Kheti Sathan Meeting at Patodi Block Office focused on strengthening women farmers through sustainable
  agriculture, practical learning and entrepreneurship — building paths towards Barefoot Agriculture Extension Service
  Providers and Lakhpati Women Farmers.
details:
  - >-
    The Kheti Sathan Meeting at Patodi Block Office, Western Rajasthan (Thar Desert), focused on strengthening women
    farmers through sustainable agriculture, practical learning, and entrepreneurship.
  - >-
    The discussions covered bio-fertilizer preparation, composting, seed coating, and water-efficient farming practices
    through field demonstrations. Special emphasis was given to promoting Bagwani (horti-pasture) as a livelihood
    opportunity and Kitchen Gardens to improve household nutrition and food security.
  - >-
    A key objective of the meeting was to prepare women farmers to become microentrepreneurs by building
    agriculture-based livelihoods and planning for long-term income generation. Women were also inspired to become
    Barefoot Agriculture Extension Service Providers, enabling them to provide technical support, demonstrate
    sustainable farming practices, and work towards becoming Lakhpati Women Farmers.
  - >-
    In the challenging agro-climatic conditions of Thar Desert in Western Rajasthan, empowering women with knowledge,
    practical skills, and entrepreneurial thinking is an important step towards building resilient livelihoods and
    sustainable agriculture.
