slug: adolescent-health-hygiene-training
title: Training on Adolescent Health and Hygiene
date: 29–30 June, 2026
venue: Jodhpur
summary: >-
  Unnati, in collaboration with Chetna Organisation, conducted a two-day Adolescent Health and Hygiene Training for 36
  Kurja-WASH Volunteers from the Patodi and Sindhri blocks of Western Rajasthan.
details:
  - >-
    Unnati, in collaboration with Chetna Organisation, conducted a two-day Adolescent Health and Hygiene Training on
    29–30 June 2026 at the Jodhpur Program Office for 36 Kurja-WASH Volunteers from the Patodi and Sindhri blocks of
    Western Rajasthan. The training aimed to strengthen adolescents' knowledge, practical skills, and leadership
    capacity to promote health, hygiene, nutrition, and well-being within their communities.
  - >-
    The training covered a range of topics critical to adolescent health and development, including adolescent
    reproductive health, menstrual hygiene management, balanced nutrition, anaemia and haemoglobin awareness,
    communicable diseases and their transmission, personal and oral hygiene, handwashing, safe drinking water, and
    healthy lifestyle practices. The sessions provided participants with practical knowledge and skills that can be
    applied in their daily lives and shared within their communities.
  - >-
    Designed around participatory learning methods, the programme included interactive discussions, group activities,
    demonstrations, practical exercises, and experience-sharing sessions. These approaches encouraged active
    participation, strengthened understanding of key health and hygiene concepts, and built confidence among the
    volunteers.
  - >-
    Kurja-WASH Volunteers are adolescent community volunteers who promote safe water, sanitation, and hygiene (WASH)
    practices while encouraging healthy behaviours among children, families, and community members. As peer educators,
    they play an important role in raising awareness, fostering positive behavioural change, and supporting healthier
    communities.
  - >-
    Through this training, the volunteers enhanced their knowledge, communication, and leadership skills, enabling them
    to effectively promote adolescent health, hygiene, and WASH practices in their respective villages. The initiative
    reflects Unnati's continued commitment to empowering young people as agents of change and strengthening
    community-led efforts towards improved health and well-being across Western Rajasthan.
