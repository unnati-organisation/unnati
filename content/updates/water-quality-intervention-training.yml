slug: water-quality-intervention-training
title: Water Quality Intervention Training
date: 01 July, 2026
venue: Jodhpur
summary: >-
  Unnati conducted a Water Quality Intervention Training at its Jodhpur Program Office for 36 Kurja-WASH volunteers from
  the Patodi and Sindhari blocks of western Rajasthan.
details:
  - >-
    On 1 July 2026, Unnati Organization conducted a Water Quality Intervention Training at its Jodhpur Program Office
    for 36 Kurja-WASH volunteers from the Patodi and Sindhari blocks of western Rajasthan. The Kurja-WASH volunteers
    work closely with pregnant women, and their families to promote awareness on safe drinking water, sanitation,
    hygiene, and healthy practices. The training aimed to strengthen their understanding of water quality and equip them
    with practical knowledge to support their community outreach.
  - >-
    The session covered key aspects of water quality, including common contaminants such as fluoride, arsenic, iron,
    salinity, and nitrate, their health implications, water quality standards, sample collection methods, field testing
    using Field Testing Kits (FTKs), and simple household water treatment practices. Through interactive discussions and
    practical demonstrations, participants gained practical knowledge that they can confidently apply while working with
    communities.
  - >-
    The knowledge and skills gained through this training will enable the volunteers to identify basic water quality
    concerns, promote safe drinking water practices, and encourage healthy water, sanitation, and hygiene (WASH)
    behaviors among the families they support. By strengthening the capacity of community volunteers, Unnati
    Organization continues to advance its commitment to improving community health and fostering sustainable change
    across western Rajasthan.
