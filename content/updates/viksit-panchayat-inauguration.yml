slug: viksit-panchayat-inauguration
title: Inauguration of the Viksit Panchayat Initiative in Gujarat
date: 16–17 October, 2025
venue: Rapar, Kutch & Dediapada, Narmada
summary: >-
  The Viksit Panchayat Initiative was inaugurated in Rapar (Kutch) and Dediapada (Narmada), with UNNATI as the state
  implementing partner for Gujarat under the Capacity Building Commission's national pilot.
details:
  - >-
    The Viksit Panchayat Initiative was officially inaugurated on October 16, 2025, in Rapar (Kutch) and on October 17,
    2025, in Dediapada (Narmada), marking the beginning of a national effort to strengthen Panchayati Raj Institutions
    (PRIs) and advance India's vision of Viksit Bharat 2047.
  - >-
    UNNATI - Organisation for Development Education has been selected by the Capacity Building Commission (CBC),
    Government of India, as the state implementing partner for Gujarat, in collaboration with the Kaivalya Education
    Foundation (KEF). The one-year pilot program focuses on building the institutional, leadership, and digital
    capacities of Gram Panchayats to enable citizen-centric and transparent local governance.
  - >-
    The inaugural workshops brought together district and taluka officials, Panchayat representatives, and community
    stakeholders to introduce the Viksit Panchayat framework and begin mentoring for selected Gram Panchayats.
  - >-
    The initiative is being implemented across 60 Gram Panchayats in four States - Gujarat, Assam, Andhra Pradesh and
    Odisha - with UNNATI leading in Gujarat, CYSD in Odisha, SeSTA in Assam, and the Piramal Foundation in Andhra
    Pradesh.
  - >-
    Through the convergence of key schemes such as MGNREGS, SBM, PMAY-G, and NRLM, the program promotes participatory
    planning, digital governance, and sustainable rural development. It aims to create replicable models for empowered
    Panchayats that contribute to an inclusive and self-reliant India.
