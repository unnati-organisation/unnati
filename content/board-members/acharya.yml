name: Mr. Binoy Acharya
role: Member Secretary
address: Ahmedabad, Gujarat, India
image: /sub-images/board-acharya.jpg
bio: "**Binoy Acharya** is the Founder-Director of UNNATI – Organisation for
  Development Education, established in 1989. A participatory development
  practitioner with four decades of experience, he has worked at the
  intersection of democratic governance, social accountability, disaster risk
  reduction, and social inclusion, with a sustained focus on strengthening the
  voice, rights, and agency of vulnerable communities. He played a key role in
  establishing Gujarat’s statewide social audit system of the government's
  employment guarantee scheme. He also provided technical support to the NDMA in
  preparing and revising India’s National Disaster Management Plan. His work
  with governments, civil society organisations, grassroots networks, and
  academic institutions has advanced decentralised planning, community-led
  development, participatory research, and inclusive public policy. He continues
  to contribute to institutional development, capacity building, and
  participatory governance."
order: 2
