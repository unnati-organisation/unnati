name: Prof. Debiprasad Mishra
role: President
address: Bhubaneswar, Odisha, India
image: /sub-images/board-mishra.jpg
bio: "Debiprasad Mishra is an academic by profession. After completing the
  Fellow Programme in Management at the IIMA, he served in the faculty of the
  Institute of Rural Management, Anand (IRMA), for 27 years. He had a brief
  stint as the Chief Executive of Gram Vikas, Odisha, before joining the
  Development Management Institute (DMI), Patna, as its Director. He is
  presently based in Patna, Bihar. "
order: 1
