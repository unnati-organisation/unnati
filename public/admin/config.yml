backend:
  name: proxy
  url: http://localhost:8081
  branch: main

# Runs against the local filesystem via `npm run cms` (decap-server proxy).
# No external services or accounts required.
local_backend: true

# Uploads land in src/assets (compiled by Astro's Image pipeline) and are
# referenced by their public path ("/images/...").
media_folder: "src/assets/images"
public_folder: "/images"

site_url: https://unnati-organisation.github.io/unnati/
display_url: https://unnati-organisation.github.io/unnati/

collections:
  - name: anchors
    label: "Anchors (Thematic Areas)"
    folder: content/anchors
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: slug
    extension: yml
    format: yaml
    sortable_fields: [order]
    summary: "{{order}}. {{title}}"
    fields:
      - { label: "Slug", name: slug, widget: string }
      - { label: "Nav Label", name: nav, widget: string }
      - { label: "Title", name: title, widget: string }
      - { label: "Tagline", name: tagline, widget: string }
      - { label: "Intro", name: intro, widget: text }
      - { label: "Image", name: image, widget: image }
      - { label: "Hero Image", name: heroImage, widget: image }
      - { label: "Order", name: order, widget: number, default: 0 }

  - name: projects
    label: "Projects"
    folder: content/projects
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: slug
    extension: yml
    format: yaml
    sortable_fields: [order]
    summary: "{{order}}. {{title}}"
    fields:
      - { label: "Slug", name: slug, widget: string }
      - { label: "Title", name: title, widget: string }
      - { label: "Summary", name: summary, widget: text }
      - { label: "Image", name: image, widget: image }
      - {
          label: "Anchor Slugs (tags)",
          name: tags,
          widget: list,
          summary: "{{fields}}",
        }
      - { label: "Period", name: period, widget: string }
      - { label: "Support", name: support, widget: string }
      - { label: "Highlights", name: highlights, widget: list }
      - { label: "Details", name: details, widget: list, required: false }
      - { label: "Gallery", name: gallery, widget: list, required: false }
      - { label: "Order", name: order, widget: number, default: 0 }

  - name: updates
    label: "Updates (Events & Activities)"
    folder: content/updates
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: slug
    extension: yml
    format: yaml
    sortable_fields: [order]
    summary: "{{order}}. {{title}}"
    fields:
      - { label: "Slug", name: slug, widget: string }
      - { label: "Title", name: title, widget: string }
      - { label: "Date", name: date, widget: string }
      - { label: "Venue", name: venue, widget: string }
      - { label: "Summary", name: summary, widget: text }
      - { label: "Details", name: details, widget: list }
      - { label: "Images", name: images, widget: list }
      - { label: "Video", name: video, widget: string, required: false }
      - { label: "Poster", name: poster, widget: image, required: false }
      - { label: "Brochure", name: brochure, widget: string, required: false }
      - { label: "Order", name: order, widget: number, default: 0 }

  - name: resources
    label: "Publications & Resources"
    folder: content/resources
    create: true
    delete: true
    slug: "{{id}}"
    identifier_field: id
    extension: yml
    format: yaml
    sortable_fields: [order]
    summary: "{{order}}. {{title}}"
    media_folder: "src/assets/pubs"
    public_folder: "/pubs"
    fields:
      - { label: "ID", name: id, widget: string }
      - { label: "Title", name: title, widget: string }
      - { label: "Description", name: description, widget: text }
      - {
          label: "Format",
          name: format,
          widget: select,
          options: [book, leaflet, report, newsletter, video],
        }
      - {
          label: "Themes",
          name: themes,
          widget: select,
          multiple: true,
          options: [sie, clgasa, drr, water, other],
        }
      - { label: "Languages", name: languages, widget: list }
      - { label: "Badge", name: badge, widget: string }
      - { label: "Year", name: year, widget: number, required: false }
      - { label: "Image", name: image, widget: image, required: false }
      - { label: "URL", name: url, widget: string, required: false }
      - { label: "Order", name: order, widget: number, default: 0 }

  - name: site
    label: "About (Site-wide)"
    media_folder: "src/assets/sub-images"
    public_folder: "/sub-images"
    files:
      - name: site
        label: "Board & Offices"
        file: content/site.yml
        fields:
          - label: "Board Members"
            name: board
            widget: list
            summary: "{{fields.name}} — {{fields.role}}"
            fields:
              - { label: "Name", name: name, widget: string }
              - { label: "Role", name: role, widget: string }
              - { label: "Address", name: address, widget: string }
              - { label: "Image", name: image, widget: image }
          - label: "Offices"
            name: offices
            widget: list
            summary: "{{fields.label}} — {{fields.city}}"
            fields:
              - { label: "City", name: city, widget: string }
              - { label: "Label", name: label, widget: string }
              - { label: "Address", name: address, widget: text }
              - { label: "Phone", name: phone, widget: string }
              - { label: "Email", name: email, widget: string }
              - { label: "Image", name: image, widget: image }

  - name: accountability
    label: "Accountability (Governance)"
    media_folder: "src/assets/sub-images"
    public_folder: "/sub-images"
    files:
      - name: accountability
        label: "Policies, Certifications & Reports"
        file: content/accountability.yml
        fields:
          - label: "Policy Groups"
            name: policyGroups
            widget: list
            summary: "{{fields.group}}"
            fields:
              - { label: "Group", name: group, widget: string }
              - { label: "Icon", name: icon, widget: string }
              - label: "Items"
                name: items
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { label: "Title", name: title, widget: string }
                  - { label: "Note", name: note, widget: string }
                  - { label: "URL", name: url, widget: string }
          - label: "Certifications"
            name: certifications
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: title, widget: string }
              - { label: "Note", name: note, widget: string }
              - { label: "URL", name: url, widget: string }
              - { label: "External", name: external, widget: boolean, required: false }
          - label: "Admin & Finance"
            name: adminFinancial
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { label: "Label", name: label, widget: string }
              - { label: "URL", name: url, widget: string }
          - label: "Annual Reports"
            name: annualReports
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { label: "Label", name: label, widget: string }
              - { label: "Image", name: image, widget: image }
              - { label: "URL", name: url, widget: string }